name: Pytest Framework

on:
  push:
    branches:
      - main

jobs:

  test:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        browser: [chrome, edge]

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Execute Tests - ${{ matrix.browser }}
        run: |
          pytest tests/test_login.py -v --headless --browser ${{ matrix.browser }}

      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.browser }}
          path: reports/
